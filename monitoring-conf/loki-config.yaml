auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

limits_config:
  retention_period: 720h # 30일 지나면 삭제
  allow_structured_metadata: true

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Compactor - 자동 삭제 활성화
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h           # 삭제 전 대기 시간
  compaction_interval: 10m             # 10분마다 압축/삭제 체크
  delete_request_store: filesystem  # 이것만 추가하면 됨!

# Storage 설정 추가
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks