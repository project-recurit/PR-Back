spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

#  elasticsearch:
#    uris: http://localhost:9200
#    username: ${ELASTIC_USERNAME}
#    password: ${ELASTIC_PASSWORD}
#    connection-timeout: 10s # 연결 타임아웃
#    socket-timeout: 30s # 소켓 타임아웃

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:

      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    secret:
      key: ${JWT_SECRET_KEY}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false